name: Dependabot guarded merge

on:
  workflow_run:
    workflows: ["程式碼檢查", "CodeQL"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "要重新檢查的 Dependabot PR number"
        required: false
        type: number

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # 所有依賴 PR 共用一條合併序列，避免同時改 pyproject.toml 時互相衝突。
  group: dependabot-merge-queue
  cancel-in-progress: false

jobs:
  approve-and-merge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: 選取合併序列最前方 PR
        id: queue
        run: |
          pr_number="$(gh pr list \
            --state open \
            --author app/dependabot \
            --label dependencies-auto-merge \
            --json number \
            --jq 'sort_by(.number) | .[0].number // empty')"
          if [ -z "$pr_number" ]; then
            echo "沒有等待處理的低風險 Dependabot PR。"
            exit 0
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: 確認身分、標籤與完整 checks
        id: gate
        if: steps.queue.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.queue.outputs.pr_number }}
        run: |
          pr_json="$(gh pr view "$PR_NUMBER" \
            --json author,baseRefName,headRefOid,labels,mergeable,mergeStateStatus,reviewDecision,state,url)"
          author="$(jq -r '.author.login' <<< "$pr_json")"
          base="$(jq -r '.baseRefName' <<< "$pr_json")"
          state="$(jq -r '.state' <<< "$pr_json")"
          if [[ "$author" != "app/dependabot" || "$base" != "main" || "$state" != "OPEN" ]]; then
            echo "非開啟中的 main Dependabot PR，停止。"
            exit 0
          fi

          for attempt in {1..6}; do
            mergeable="$(jq -r '.mergeable' <<< "$pr_json")"
            [[ "$mergeable" != "UNKNOWN" ]] && break
            sleep 5
            pr_json="$(gh pr view "$PR_NUMBER" \
              --json author,baseRefName,headRefOid,labels,mergeable,mergeStateStatus,reviewDecision,state,url)"
          done

          head_sha="$(jq -r '.headRefOid' <<< "$pr_json")"
          mergeable="$(jq -r '.mergeable' <<< "$pr_json")"
          merge_state="$(jq -r '.mergeStateStatus' <<< "$pr_json")"
          auto_label="$(jq -r '[.labels[].name == "dependencies-auto-merge"] | any' <<< "$pr_json")"
          rebase_requested="$(
            jq -r '[.labels[].name == "dependencies-rebase-requested"] | any' <<< "$pr_json"
          )"

          if [[ "$auto_label" != "true" ]]; then
            echo "沒有低風險自動合併標籤，停止。"
            exit 0
          fi
          if [[ "$mergeable" == "CONFLICTING" || "$merge_state" == "DIRTY" || "$merge_state" == "BEHIND" ]]; then
            if [[ "$rebase_requested" != "true" ]]; then
              gh label create "dependencies-rebase-requested" \
                --color "0969da" \
                --description "合併序列已要求 Dependabot 依最新 main 重整分支" \
                --force
              gh pr edit "$PR_NUMBER" --add-label "dependencies-rebase-requested"
              gh pr comment "$PR_NUMBER" --body "@dependabot rebase"
            fi
            echo "PR 需先依最新 main 重整；等待 synchronize 後重新跑完整 Gate。"
            exit 0
          fi
          if [[ "$mergeable" != "MERGEABLE" ]]; then
            echo "GitHub 尚無法確認 PR 可合併（$mergeable / $merge_state），停止並等待下一次 Gate。"
            exit 0
          fi

          policy_conclusion="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs?per_page=100" \
            --jq '
              .check_runs
              | map(select(.name == "Dependabot policy" and .app.slug == "github-actions"))
              | sort_by(.started_at)
              | reverse
              | .[0].conclusion // "MISSING"
            ')"
          if [[ "$policy_conclusion" != "success" ]]; then
            echo "head SHA 沒有可信的低風險政策 Check，停止（$policy_conclusion）。"
            exit 0
          fi

          checks_json="$(gh pr checks "$PR_NUMBER" --json name,state 2>/dev/null || true)"
          required_checks=(
            "check (ubuntu-latest, 3.10)"
            "check (ubuntu-latest, 3.11)"
            "check (ubuntu-latest, 3.12)"
            "check (windows-latest, 3.12)"
            "check (macos-latest, 3.12)"
            "Python security scan"
          )
          for check_name in "${required_checks[@]}"; do
            check_state="$(jq -r \
              --arg name "$check_name" \
              '[.[] | select(.name == $name)][0].state // "MISSING"' \
              <<< "$checks_json")"
            if [[ "$check_state" != "SUCCESS" ]]; then
              echo "$check_name 尚未成功（$check_state），等待下一次 Gate。"
              exit 0
            fi
          done

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "review_decision=$(jq -r '.reviewDecision // ""' <<< "$pr_json")" >> "$GITHUB_OUTPUT"

      - name: 自動核准
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.review_decision != 'APPROVED'
        env:
          PR_NUMBER: ${{ steps.queue.outputs.pr_number }}
        run: >-
          gh pr review "$PR_NUMBER" --approve
          --body "週期性依賴維護已完成政策分類；必要 CI、工具實跑與 CodeQL 已全部通過。"

      - name: 防止換頭或決策變更後自動合併
        if: steps.gate.outputs.ready == 'true'
        env:
          EXPECTED_HEAD: ${{ steps.gate.outputs.head_sha }}
          PR_NUMBER: ${{ steps.queue.outputs.pr_number }}
        run: |
          current_json="$(gh pr view "$PR_NUMBER" --json headRefOid,labels)"
          current_head="$(jq -r '.headRefOid' <<< "$current_json")"
          auto_label="$(jq -r '[.labels[].name == "dependencies-auto-merge"] | any' <<< "$current_json")"
          manual_label="$(jq -r '[.labels[].name == "dependencies-manual-review"] | any' <<< "$current_json")"
          test "$current_head" = "$EXPECTED_HEAD"
          test "$auto_label" = "true"
          test "$manual_label" = "false"

          policy_conclusion="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$current_head/check-runs?per_page=100" \
            --jq '
              .check_runs
              | map(select(.name == "Dependabot policy" and .app.slug == "github-actions"))
              | sort_by(.started_at)
              | reverse
              | .[0].conclusion // "MISSING"
            ')"
          test "$policy_conclusion" = "success"

      - name: Squash 合併、關閉 PR 並刪除分支
        if: steps.gate.outputs.ready == 'true'
        env:
          PR_NUMBER: ${{ steps.queue.outputs.pr_number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --match-head-commit "${{ steps.gate.outputs.head_sha }}"

          merged_json="$(gh pr view "$PR_NUMBER" --json state,closedAt)"
          test "$(jq -r '.state' <<< "$merged_json")" = "MERGED"
          test "$(jq -r '.closedAt // empty' <<< "$merged_json")" != ""

      - name: 合併後重新驗證維護 issue
        if: steps.gate.outputs.ready == 'true'
        run: gh workflow run dependency-freshness.yml --ref main
