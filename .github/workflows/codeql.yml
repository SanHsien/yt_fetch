name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Python security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v7

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: 執行 CodeQL 分析
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
