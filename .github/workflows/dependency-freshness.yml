name: 依賴新鮮度檢查

on:
  schedule:
    # 每月 1 日檢查 yt-dlp / imageio-ffmpeg 是否有新版，提醒是否需要重發 EXE。
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v7

      - name: 設定 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 檢查依賴新鮮度
        id: deps
        run: |
          python tools/check_dependency_freshness.py \
            --github-output \
            --output dependency-freshness-report.md
          cat dependency-freshness-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 建立或更新維護提醒 issue
        if: steps.deps.outputs.needs_attention == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue="$(gh issue list --state open --search '依賴新鮮度檢查 in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file dependency-freshness-report.md
          else
            gh issue create \
              --title "依賴新鮮度檢查：需要維護" \
              --body-file dependency-freshness-report.md
          fi

      - name: 關閉已解決的維護提醒 issue
        if: steps.deps.outputs.needs_attention == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue="$(gh issue list --state open --search '依賴新鮮度檢查 in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "本次排程檢查已確認追蹤依賴皆為最新，關閉提醒。"
          fi
