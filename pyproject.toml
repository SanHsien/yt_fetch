[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-fetch"
version = "1.9.2"
description = "ChannelDepot — portable YouTube channel archiving with GUI, batch workflows, filters, and authorized sign-in cookies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SanHsien"}
]
keywords = ["youtube", "download", "video", "yt-dlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "yt-dlp>=2026.7.4",
    "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "isort>=8.0.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    # 最低 Python 版本相容性檢查（避免用到 3.11+ 才有的語法卻宣稱支援 3.10）
    "vermin>=1.8.0",
]
build = [
    "pyinstaller>=6.22.0",
]

[project.scripts]
yt-fetch = "yt_fetch:main"

[project.gui-scripts]
yt-fetch-gui = "yt_fetch_gui:main"

[project.urls]
Homepage = "https://github.com/SanHsien/yt_fetch"
Repository = "https://github.com/SanHsien/yt_fetch"
Issues = "https://github.com/SanHsien/yt_fetch/issues"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | download
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "venv", "build", "dist", "download"]

[tool.setuptools]
py-modules = ["yt_fetch", "yt_fetch_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
